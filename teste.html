<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teste de Áudio</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --border:#2c313c; --text:#e8eaf0; --muted:#9aa1b2; --accent:#4f8cff; --ok:#3ecf8e; --danger:#ef4d5a; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; font-weight:600; }
  button.sec { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:400; }
  .res { margin-top:8px; font-family:ui-monospace, Consolas, monospace; font-size:13px; white-space:pre-wrap; }
  .ok { color:var(--ok); } .bad { color:var(--danger); } .muted { color:var(--muted); font-size:13px; }
  .meter { height:10px; background:#000; border-radius:5px; overflow:hidden; margin-top:6px; }
  .meter div { height:100%; width:0; background:var(--ok); transition:width .08s; }
  textarea { width:100%; box-sizing:border-box; height:140px; background:#000; color:var(--text); border:1px solid var(--border); border-radius:8px; font:12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="margin:0 0 4px">Teste de áudio do PC</h1>
  <p class="muted">Deixe uma música tocando. Em cada teste, escolha <b>Tela inteira</b> e marque <b>Compartilhar áudio do sistema</b>. A barra verde deve se mexer com o som.</p>
  <div id="tests"></div>
  <div class="card">
    <div style="margin-bottom:6px">Resultado para enviar:</div>
    <textarea id="out" readonly></textarea>
    <button class="sec" id="copy" style="margin-top:8px">Copiar resultado</button>
  </div>
</div>
<script>
"use strict";
const extra = { systemAudio: "include", selfBrowserSurface: "exclude", surfaceSwitching: "include", monitorTypeSurfaces: "include" };
const video1080 = { frameRate: { ideal: 60, max: 60 }, width: { ideal: 1920, max: 1920 }, height: { ideal: 1080, max: 1080 } };
const tests = [
  ["1. Mínimo (video: true, audio: true)", { video: true, audio: true }],
  ["2. Vídeo 1080p60 do site, sem opções extras", { video: video1080, audio: true }],
  ["3. Opções extras do site, vídeo simples", { video: true, audio: true, ...extra }],
  ["4. Exatamente como o site pede", { video: video1080, audio: true, ...extra }],
  ["5. Sem selfBrowserSurface", { video: video1080, audio: true, systemAudio: "include", surfaceSwitching: "include", monitorTypeSurfaces: "include" }],
  ["6. Sem surfaceSwitching", { video: video1080, audio: true, systemAudio: "include", selfBrowserSurface: "exclude", monitorTypeSurfaces: "include" }],
];
const results = {};
let active = null;

function writeOut() {
  $out.value = navigator.userAgent + "\n" + Object.keys(results).sort().map((k) => results[k]).join("\n");
}
const $out = document.getElementById("out");

tests.forEach(([name, opts], i) => {
  const card = document.createElement("div"); card.className = "card";
  const btn = document.createElement("button"); btn.textContent = name;
  const res = document.createElement("div"); res.className = "res muted"; res.textContent = "Não testado";
  const meter = document.createElement("div"); meter.className = "meter"; meter.hidden = true;
  const bar = document.createElement("div"); meter.append(bar);
  card.append(btn, res, meter);
  document.getElementById("tests").append(card);

  btn.onclick = async () => {
    if (active) active();
    let s;
    try {
      s = await navigator.mediaDevices.getDisplayMedia(opts);
    } catch (e) {
      res.className = "res bad"; res.textContent = "ERRO " + e.name + ": " + e.message;
      results[i] = name + " -> ERRO " + e.name + ": " + e.message; writeOut(); return;
    }
    const v = s.getVideoTracks()[0], a = s.getAudioTracks()[0];
    const vs = v ? v.getSettings() : {};
    const surface = vs.displaySurface || "?";
    let line = "OK · superfície: " + surface + " · vídeo " + (vs.width || "?") + "x" + (vs.height || "?") + "@" + Math.round(vs.frameRate || 0);
    line += a ? " · ÁUDIO: sim (" + (a.label || "sem nome") + ")" : " · ÁUDIO: NÃO veio";
    res.className = "res " + (a ? "ok" : "bad"); res.textContent = line + "\nVerificando se o som chega…";
    results[i] = name + " -> " + line; writeOut();

    let raf = 0, ctx = null, peak = 0;
    const stop = () => { cancelAnimationFrame(raf); s.getTracks().forEach((t) => t.stop()); if (ctx) ctx.close(); meter.hidden = true; active = null; };
    active = stop;
    if (a) {
      ctx = new AudioContext();
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      ctx.createMediaStreamSource(new MediaStream([a])).connect(an);
      const buf = new Float32Array(an.fftSize);
      meter.hidden = false;
      const t0 = performance.now();
      const loop = () => {
        an.getFloatTimeDomainData(buf);
        let m = 0; for (const x of buf) m = Math.max(m, Math.abs(x));
        peak = Math.max(peak, m);
        bar.style.width = Math.min(100, m * 140) + "%";
        if (performance.now() - t0 > 5000) {
          const heard = peak > 0.005;
          res.textContent = line + "\nSom chegando: " + (heard ? "SIM" : "NÃO (silêncio por 5 s)");
          results[i] = name + " -> " + line + " · som chegando: " + (heard ? "sim" : "não");
          writeOut(); stop(); return;
        }
        raf = requestAnimationFrame(loop);
      };
      loop();
    } else { setTimeout(stop, 1500); }
  };
});
writeOut();
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($out.value); } catch { $out.select(); document.execCommand("copy"); }
  document.getElementById("copy").textContent = "Copiado!";
};
</script>
</body>
</html>
